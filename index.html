<script>
// Switch tabs in builder
function switchBuilderTab(tab) {
  const tabs = ['questions', 'endscreen', 'theme'];
  tabs.forEach(t => {
    const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
    const content = document.getElementById(`tabContent${t.charAt(0).toUpperCase() + t.slice(1)}`);
    if (t === tab) {
      btn.className = "py-2 px-4 font-semibold text-sm rounded-t-lg border-b-2 border-emerald-600 text-emerald-600 dark:text-emerald-400 bg-white dark:bg-gray-900 transition-colors";
      content.classList.remove('hidden');
    } else {
      btn.className = "py-2 px-4 font-semibold text-sm rounded-t-lg border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors";
      content.classList.add('hidden');
    }
  });
}

// Populate Builder UI with active quiz data
function populateBuilderUI() {
  document.getElementById('builderQuizTitle').value = activeQuiz.title || '';
  document.getElementById('builderQuizDesc').value = activeQuiz.description || '';
  
  // End Screen Settings
  const es = activeQuiz.endScreen || DEFAULT_QUIZ.endScreen;
  document.getElementById('builderEndTitle').value = es.title || '';
  document.getElementById('builderEndSubtitle').value = es.subtitle || '';
  document.getElementById('builderShowConfetti').checked = es.showConfetti !== false;

  // High Tier
  document.getElementById('builderHighTitle').value = es.highScoreTier?.title || '';
  document.getElementById('builderHighEmoji').value = es.highScoreTier?.mediaEmoji || '🎉';
  document.getElementById('builderHighMsg').value = es.highScoreTier?.message || '';
  document.getElementById('builderHighCtaText').value = es.highScoreTier?.ctaText || '';
  document.getElementById('builderHighCtaUrl').value = es.highScoreTier?.ctaUrl || '';

  // Med Tier
  document.getElementById('builderMedTitle').value = es.mediumScoreTier?.title || '';
  document.getElementById('builderMedEmoji').value = es.mediumScoreTier?.mediaEmoji || '🌟';
  document.getElementById('builderMedMsg').value = es.mediumScoreTier?.message || '';
  document.getElementById('builderMedCtaText').value = es.mediumScoreTier?.ctaText || '';
  document.getElementById('builderMedCtaUrl').value = es.mediumScoreTier?.ctaUrl || '';

  // Low Tier
  document.getElementById('builderLowTitle').value = es.lowScoreTier?.title || '';
  document.getElementById('builderLowEmoji').value = es.lowScoreTier?.mediaEmoji || '🌱';
  document.getElementById('builderLowMsg').value = es.lowScoreTier?.message || '';
  document.getElementById('builderLowCtaText').value = es.lowScoreTier?.ctaText || '';
  document.getElementById('builderLowCtaUrl').value = es.lowScoreTier?.ctaUrl || '';

  renderQuestionsBuilderList();
}

// Update Quiz Object from Builder Form Inputs
function updateQuizFromBuilder() {
  activeQuiz.title = document.getElementById('builderQuizTitle').value;
  activeQuiz.description = document.getElementById('builderQuizDesc').value;

  if (!activeQuiz.endScreen) activeQuiz.endScreen = {};
  activeQuiz.endScreen.title = document.getElementById('builderEndTitle').value;
  activeQuiz.endScreen.subtitle = document.getElementById('builderEndSubtitle').value;
  activeQuiz.endScreen.showConfetti = document.getElementById('builderShowConfetti').checked;

  activeQuiz.endScreen.highScoreTier = {
    minScore: 70,
    title: document.getElementById('builderHighTitle').value,
    mediaEmoji: document.getElementById('builderHighEmoji').value,
    message: document.getElementById('builderHighMsg').value,
    ctaText: document.getElementById('builderHighCtaText').value,
    ctaUrl: document.getElementById('builderHighCtaUrl').value
  };

  activeQuiz.endScreen.mediumScoreTier = {
    minScore: 40,
    title: document.getElementById('builderMedTitle').value,
    mediaEmoji: document.getElementById('builderMedEmoji').value,
    message: document.getElementById('builderMedMsg').value,
    ctaText: document.getElementById('builderMedCtaText').value,
    ctaUrl: document.getElementById('builderMedCtaUrl').value
  };

  activeQuiz.endScreen.lowScoreTier = {
    minScore: 0,
    title: document.getElementById('builderLowTitle').value,
    mediaEmoji: document.getElementById('builderLowEmoji').value,
    message: document.getElementById('builderLowMsg').value,
    ctaText: document.getElementById('builderLowCtaText').value,
    ctaUrl: document.getElementById('builderLowCtaUrl').value
  };

  saveQuizState();
  if (currentStep === -1) {
    renderStartScreen();
  }
}

function renderResultsScreen() {
  const container = document.getElementById('quizContentArea');
  const total = activeQuiz.questions.length;
  const pct = total > 0 ? Math.round((userScore / total) * 100) : 0;

  const es = activeQuiz.endScreen || DEFAULT_QUIZ.endScreen;

  // Determine Tier
  let tier = es.lowScoreTier;
  if (pct >= (es.highScoreTier?.minScore ?? 70)) {
    tier = es.highScoreTier;
  } else if (pct >= (es.mediumScoreTier?.minScore ?? 40)) {
    tier = es.mediumScoreTier;
  }

  // Trigger confetti if high score and enabled
  if (pct >= 70 && es.showConfetti !== false) {
    triggerConfetti();
  }

  container.innerHTML = `
    <div class="text-center space-y-6 max-w-xl mx-auto py-4 animate-fade-in">
      <div class="text-6xl animate-bounce mb-2">${tier.mediaEmoji || '🎉'}</div>
      
      <div>
        <h2 class="text-3xl font-extrabold text-gray-800 dark:text-gray-100">${es.title || 'Quiz Completed!'}</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-1">${es.subtitle || 'Here is how you performed:'}</p>
      </div>

      <div class="p-6 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl border border-emerald-200 dark:border-emerald-800 text-center shadow-sm">
        <p class="text-sm uppercase tracking-wider text-emerald-600 dark:text-emerald-400 font-bold mb-1">Your Score</p>
        <div class="text-5xl font-black text-emerald-700 dark:text-emerald-300">${userScore} / ${total}</div>
        <div class="text-lg font-semibold text-emerald-800 dark:text-emerald-200 mt-1">(${pct}%)</div>
      </div>

      <div class="p-5 bg-gray-50 dark:bg-gray-800/60 rounded-xl border border-gray-200 dark:border-gray-700 text-left">
        <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">${tier.title || ''}</h3>
        <p class="text-gray-600 dark:text-gray-300 leading-relaxed text-base">${tier.message || ''}</p>
      </div>

      ${tier.ctaText && tier.ctaUrl ? `
        <div class="pt-2">
          <a href="${tier.ctaUrl}" target="_blank" rel="noopener noreferrer" 
             class="inline-flex items-center justify-center gap-2 px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition-all hover:scale-105 w-full text-lg">
            <span>${tier.ctaText}</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin=" His" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
        </div>
      ` : ''}

      <div class="flex flex-col sm:flex-row gap-3 pt-4">
        <button onclick="restartQuiz()" class="flex-1 py-3 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all">
          🔄 Retake Quiz
        </button>
        <button onclick="shareScore(${userScore}, ${total})" class="flex-1 py-3 px-6 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-100 font-bold rounded-xl transition-all">
          🔗 Share Results
        </button>
      </div>
    </div>
  `;
}
</script>
